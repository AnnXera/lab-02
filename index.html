<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogi Ann</title>

    <link rel="stylesheet" href="./main.css" />

    <link rel="icon" type="image/png" href="Images/Icon.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="script.js"></script>

</head>
<body>
    
    <!-- Nav Bar -->
    <header class="fixed w-full top-0 left-0 h-[84px] px-[70px] backdrop-blur-[10px] flex items-center z-[1000]">
        
        <a  class="cursor-pointer duration-300 ease-in-out hover:scale-110" href="#logo">
            <img src="Images/RGLogo.svg" alt="logo">
        </a>

        <nav class="flex ml-auto gap-[37px] text-[18.8px] mx-[37px] font-[700]">
            <a class="pb-1 border-b-[3px] border-transparent duration-300 hover:border-[#644737] hover:text-[#644737]" href="#home">Home</a>
            <a class="pb-1 border-b-[3px] border-transparent duration-300 hover:border-[#644737] hover:text-[#644737]" href="#about">About Me</a>
            <a class="pb-1 border-b-[3px] border-transparent duration-300 hover:border-[#644737] hover:text-[#644737]" href="#skills">Skills</a>
            <a class="pb-1 border-b-[3px] border-transparent duration-300 hover:border-[#644737] hover:text-[#644737]" href="#projects">Projects</a>
            <a class="pb-1 border-b-[3px] border-transparent duration-300 hover:border-[#644737] hover:text-[#644737]" href="#contact">Contact</a>
        </nav>

    </header>

    <!-- Hero Section -->
    <section id="home" class="flex flex-col bg-[url('Images/Home.svg')] bg-cover bg-center bg-no-repeat items-center min-h-screen pt-[84px] px-[70px] scroll-mt-[84px]">

        <div class="font-[MagicRetro] mt-[61px] text-[28px] sm:text-[36px] md:text-[48px] lg:text-[63.89px]">
            hi there, it's
        </div>

        <div class="mt-0 max-w-full h-auto duration-300 ease-in-out hover:scale-105">
            <img src="Images/Name.svg" alt="">
        </div>

        <div class="text-center">
            <a
                href="#contact"
                class="inline-block w-[211px] mt-[40px] px-[29px] py-[10px] text-[18px] text-[#F7EFDA] font-[600] rounded-[40px] bg-[#738942] border-[2px] border-[#738942] duration-300 ease-linear hover:text-[#644737] hover:bg-[#F7EFDA] hover:border-[#644737] text-center"
            >
                Contact Me
            </a>
        </div>

    </section>

    <!-- Contact Section -->

    <section id="contact" class="bg-[url('Images/FrameContact.svg')] bg-center bg-no-repeat mx-auto min-h-screen flex flex-col pt-[84px] scroll-m-0 px-[70px] text-[#644737]">

        <div class="mt-[20px] mx-auto">
            <img src="Images/Contact Me.svg" alt="ContactImage">
        </div>

        <form class="mt-[40px] w-full max-w-[505px] mx-auto" id='contact-form' method='POST' name='contact'>

            <input type="hidden" name="form-name" value="contact" />

            <div class="mb-[20px]">
            <input
                id="form-field"
                name="name"
                type="text"
                placeholder="Your Name"
                class="h-[41px] w-full px-[15px] py-[15px] rounded-[10px] border-[2px] border-[#738942] bg-[#F7EFDA] focus:outline-none focus:border-[#644737]"
                required
            />
            </div>

            <div class="mb-[20px]">
            <input
                id="form-field"
                type="email"
                name="email"
                placeholder="Your Email"
                class="h-[41px] w-full px-[15px] py-[15px] rounded-[10px] border-[2px] border-[#738942] bg-[#F7EFDA] focus:outline-none focus:border-[#644737]"
                required
            />
            </div>

            <div class="mb-[40px]">
            <textarea
                id="form-field"
                name="message"
                rows="4"
                placeholder="Your Message"
                class="min-h-[185px] max-h-[185px] w-full px-[15px] py-[15px] rounded-[10px] border-[2px] border-[#738942] bg-[#F7EFDA] focus:outline-none focus:border-[#644737]"
                required
            ></textarea>
            </div>

            <div class="text-center">
                <button class="md:text-[16px] md:h-[41px] md:w-full text-center text-[10px] h-[37px] w-full text-[#F7EFDA] font-[600] rounded-[40px] bg-[#738942] border-[2px] border-[#738942] duration-300 ease-linear hover:text-[#644737] hover:bg-[#F7EFDA] hover:border-[#644737]">
                    Send Message
                </button>
            </div>

        </form>

        <div
            id="form-message"
            class="border-[2px] border-[#644737] mt-[40px] text-[16px] font-[600] py-[10px] rounded-[40px] w-full max-w-[504px] mx-auto opacity-0"
            aria-hidden="true"
        ></div>
    </section>

</body>
</html>
